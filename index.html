<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쇼핑 리스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #222;
            font-weight: 500;
            font-size: 14px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        .focus-visible:focus {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            color: #222;
        }

        input[type="text"]:focus {
            outline: 3px solid #667eea;
            outline-offset: 2px;
            border-color: #667eea;
        }

        input[type="text"]::placeholder {
            color: #888;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            border-color: #5568d3;
        }

        button:focus {
            outline: 3px solid #333;
            outline-offset: 2px;
        }

        button:active {
            transform: scale(0.98);
        }

        .list-container {
            max-height: 400px;
            overflow-y: auto;
        }

        .list-container::-webkit-scrollbar {
            width: 8px;
        }

        .list-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .list-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .list-container::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .shopping-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .shopping-item.checked {
            opacity: 0.6;
        }

        .shopping-item.checked .item-text {
            text-decoration: line-through;
            color: #999;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
            margin: 0;
        }

        input[type="checkbox"]:focus {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        .item-text {
            flex: 1;
            font-size: 16px;
            color: #222;
            word-break: break-word;
        }

        .delete-btn {
            background: #ff6b6b;
            padding: 8px 12px;
            font-size: 14px;
            min-width: auto;
        }

        .delete-btn:hover {
            background: #ff5252;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 16px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding-top: 20px;
            border-top: 2px solid #eee;
            margin-top: 20px;
            text-align: center;
        }

        .stat {
            flex: 1;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <h1>🛒 쇼핑 리스트</h1>

            <section aria-labelledby="add-item-heading">
                <h2 id="add-item-heading" class="sr-only">새 아이템 추가</h2>
                <form onsubmit="handleAddItem(event)">
                    <label for="itemInput">새로운 아이템</label>
                    <div class="input-group">
                        <input
                            type="text"
                            id="itemInput"
                            placeholder="새로운 아이템을 입력하세요..."
                            autocomplete="off"
                            required
                            aria-required="true"
                            aria-describedby="input-help"
                        >
                        <button type="submit" class="focus-visible">추가</button>
                    </div>
                    <span id="input-help" class="sr-only">텍스트를 입력하고 추가 버튼을 클릭하거나 Enter 키를 누르세요.</span>
                </form>
            </section>

            <section aria-labelledby="list-heading">
                <h2 id="list-heading" class="sr-only">쇼핑 리스트</h2>
                <div class="list-container" id="listContainer" role="list">
                    <div class="empty-message">아이템을 추가해보세요!</div>
                </div>
            </section>

            <section aria-labelledby="stats-heading">
                <h2 id="stats-heading" class="sr-only">통계</h2>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number" id="totalCount" aria-live="polite" aria-label="전체 아이템 수">0</div>
                        <div class="stat-label">전체</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="checkedCount" aria-live="polite" aria-label="완료한 아이템 수">0</div>
                        <div class="stat-label">완료</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="remainCount" aria-live="polite" aria-label="남은 아이템 수">0</div>
                        <div class="stat-label">남은 항목</div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // DOM 요소
        const itemInput = document.getElementById('itemInput');
        const listContainer = document.getElementById('listContainer');
        const totalCountEl = document.getElementById('totalCount');
        const checkedCountEl = document.getElementById('checkedCount');
        const remainCountEl = document.getElementById('remainCount');

        // 상태
        let items = [];
        let isLoading = true;
        let sbClient = null;

        // Supabase 설정
        const SUPABASE_URL = 'https://ifiiqljuevjtxolcvoar.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_pk3c5FALXPa6dUquax4iRA_zOLlBIi3';

        // 초기화
        async function init() {
            // Supabase 라이브러리 로드 대기
            let retries = 0;
            while (!window.supabase && retries < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                retries++;
            }

            if (!window.supabase) {
                console.error('Supabase 라이브러리 로드 실패');
                return;
            }

            sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            await loadItems();
        }

        // 초기 데이터 로드
        async function loadItems() {
            try {
                isLoading = true;
                const { data, error } = await sbClient
                    .from('shopping_items')
                    .select('*')
                    .order('created_at', { ascending: true });

                if (error) throw error;
                items = data || [];
                renderList();
            } catch (error) {
                console.error('데이터 로드 실패:', error);
            } finally {
                isLoading = false;
            }
        }

        // 아이템 추가
        async function handleAddItem(event) {
            event.preventDefault();
            const text = itemInput.value.trim();

            if (!text || isLoading || !sbClient) {
                itemInput.focus();
                return;
            }

            try {
                isLoading = true;
                const { data, error } = await sbClient
                    .from('shopping_items')
                    .insert([{ text: text, checked: false }])
                    .select();

                if (error) throw error;

                if (data && data.length > 0) {
                    items.push(data[0]);
                    renderList();
                    itemInput.value = '';
                    itemInput.focus();
                }
            } catch (error) {
                console.error('아이템 추가 실패:', error);
            } finally {
                isLoading = false;
            }
        }

        // 아이템 삭제
        async function deleteItem(id) {
            try {
                isLoading = true;
                const { error } = await sbClient
                    .from('shopping_items')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                items = items.filter(item => item.id !== id);
                renderList();
            } catch (error) {
                console.error('아이템 삭제 실패:', error);
            } finally {
                isLoading = false;
            }
        }

        // 체크 상태 변경
        async function toggleCheck(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            try {
                isLoading = true;
                const { error } = await sbClient
                    .from('shopping_items')
                    .update({ checked: !item.checked })
                    .eq('id', id);

                if (error) throw error;

                item.checked = !item.checked;
                renderList();
            } catch (error) {
                console.error('아이템 업데이트 실패:', error);
            } finally {
                isLoading = false;
            }
        }

        // 리스트 렌더링
        function renderList() {
            if (items.length === 0) {
                listContainer.innerHTML = '<div class="empty-message">아이템을 추가해보세요!</div>';
                listContainer.removeAttribute('role');
                updateStats();
                return;
            }

            listContainer.setAttribute('role', 'list');
            listContainer.innerHTML = items.map(item => `
                <div class="shopping-item ${item.checked ? 'checked' : ''}" role="listitem">
                    <input
                        type="checkbox"
                        class="item-checkbox"
                        data-id="${item.id}"
                        ${item.checked ? 'checked' : ''}
                        aria-label="${item.checked ? '완료 해제:' : '완료:'} ${escapeHtml(item.text)}"
                    >
                    <span class="item-text">${escapeHtml(item.text)}</span>
                    <button class="delete-btn" data-id="${item.id}" aria-label="삭제: ${escapeHtml(item.text)}">삭제</button>
                </div>
            `).join('');

            // 이벤트 리스너 재설정
            document.querySelectorAll('.item-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    toggleCheck(parseInt(e.target.dataset.id));
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    deleteItem(parseInt(e.target.dataset.id));
                });
            });

            updateStats();
        }

        // 통계 업데이트
        function updateStats() {
            const total = items.length;
            const checked = items.filter(item => item.checked).length;
            const remain = total - checked;

            totalCountEl.textContent = total;
            checkedCountEl.textContent = checked;
            remainCountEl.textContent = remain;
        }

        // HTML 이스케이프
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 앱 시작
        init();
    </script>
</body>
</html>
